[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "competition-radar"
version = "0.1.0"
description = "Competition Radar：大学生竞赛搜索与推荐智能体（A/B/C/D 集成）"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "tzdata>=2025.2"]

[dependency-groups]
dev = ["pytest>=8,<10"]
integration = [
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/competition_radar", "src/b_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
